name: Build

on:
  # Package and publish only on version tags. Ordinary pushes and pull requests
  # are covered by ci.yml; use the manual trigger for an on-demand package build.
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --publish never
            artifact: DeepSeek-Harness-windows
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
            artifact: DeepSeek-Harness-macos
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --publish never
            artifact: DeepSeek-Harness-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and desktop integration
        run: npm run check

      - name: Build installers
        shell: bash
        env:
          # Explicit certificate name so the Developer ID Application identity is
          # used (auto-discovery may pick the runner's "Apple Development" cert).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Apple signing/notarization secrets only on macOS tagged releases;
          # manually triggered builds stay unsigned.
          CSC_NAME: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_NAME || '' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Empty-string CSC_LINK makes electron-builder treat "" as a path and
          # crash ("not a file"); drop the variable entirely when unused.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          # macOS + tag + certificate configured → sign & notarize; otherwise keep unsigned.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "${CSC_LINK:-}" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            ${{ matrix.cmd }}
          fi

      - name: Verify packaged Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "dist/DSH-Desktop-$version-win-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'DSH installed 测试'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/smoke-windows.mjs "$installDir/DSH-Desktop.exe" --require-rendered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-windows.mjs "dist/DSH-Desktop-$version-win-x64-portable.exe" --require-rendered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release (Windows verified)
    # The matrix keeps running when one platform fails. Always enter this job
    # for a tag, but require both smoke-tested Windows artifacts before publishing.
    # Successful macOS/Linux artifacts are included when available.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download successful platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Require tested Windows installer and portable artifacts
        shell: bash
        run: |
          if ! compgen -G 'artifacts/*-win-x64-setup.exe' > /dev/null || ! compgen -G 'artifacts/*-win-x64-portable.exe' > /dev/null; then
            echo "Tested Windows installer and portable artifacts are required; refusing an incomplete release."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # 发布描述模板：每次发版前把「更新日志」小节改成当次内容
          # （上游版本号记得同步成 package.json 里 @deepseek-ai/dsh 的版本）。
          body: |
            ## DSH Desktop ${{ github.ref_name }}

            内置 DeepSeek Harness：**@deepseek-ai/dsh 0.1.5-rc.1**。

            ### 改进
            - 修复 electron-builder 遗漏 DSH 运行时 peerDependencies 的问题，避免独立安装后出现 `ERR_MODULE_NOT_FOUND`（如 `dsh-attachment`、`dsh-session-persistence`、`dsh-session-query` 和 `dsh-util-time`）。
            - 新增真实打包依赖收集回归测试；所有 Windows 成品启动检查均脱离源码依赖目录，避免开发环境掩盖缺失依赖。
            - 修复 RC.5 的 Windows 构建失败：语法检查改为 Node.js 逐文件枚举，消除 Windows 不展开通配符的问题，并完整检查所有 JavaScript 文件。
            - 发布前实际安装并启动 Windows 安装版、启动便携版，验证隔离数据目录下的本机/LAN 服务、token/Cookie 认证和 Electron 窗口页面加载。
            - Windows 安装版和便携版都通过启动验证后才允许发布，避免再次出现缺少 Windows 产物的 RC。
            - 服务日志新增桌面页面加载失败和渲染进程退出诊断，便于排查机器或已有数据相关的启动异常。

            ### 安全说明
            - `0.0.0.0` 监听会向局域网开放可执行本机命令的 agent，仅建议在可信网络使用；公网访问请使用 SSH 隧道或其他认证层。
            - LAN 端可驱动 agent、读写会话，但 `settings.*` / `credentials.*` 等特权方法仍由上游限制在回环地址。
          # -rc / -beta 标签标记为 prerelease：不进 Latest，稳定版的
          # electron-updater（allowPrerelease=false）也不会把它们推给用户
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
