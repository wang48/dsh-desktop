name: Build

on:
  # Build + publish only on version tags; everyday main pushes stay lightweight
  # (no CI run). Use the manual "Run workflow" button to test-build on demand.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --publish never
            artifact: DeepSeek-Harness-windows
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
            artifact: DeepSeek-Harness-macos
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --publish never
            artifact: DeepSeek-Harness-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        env:
          # Explicit certificate name so the Developer ID Application identity is
          # used (auto-discovery may pick the runner's "Apple Development" cert).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Apple signing/notarization secrets only on macOS tagged releases;
          # main pushes build unsigned (fast sanity builds).
          CSC_NAME: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_NAME || '' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Empty-string CSC_LINK makes electron-builder treat "" as a path and
          # crash ("not a file"); drop the variable entirely when unused.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          # macOS + tag + certificate configured → sign & notarize; otherwise keep unsigned.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "${CSC_LINK:-}" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            ${{ matrix.cmd }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body: |
            ## DSH Desktop v0.2.6

            基于 DeepSeek Harness（@deepseek-ai/dsh 0.1.0-rc.7）的桌面外壳。

            ### 新功能
            - **局域网访问**：设置页新增「开放局域网访问」开关（默认开启），通过上游官方 `--patch` 机制绑定 `0.0.0.0`；设置页只列出物理网卡的 IPv4 访问链接（可点击、在默认浏览器打开），远程设备打开后默认进入最近会话
            - **主题同步**：外壳设置页/加载页/错误页与 DSH Web 主题完全一致，消除启动与返回时的白闪
            - **macOS 粘贴修复**：新增「编辑」菜单（撤销/复制/粘贴/全选等标准 role），Cmd+V 恢复；菜单标签跟随系统语言（英文系统显示 Paste ⌘V）
            - **新图标**：黑白灰三阶单色（深灰底 + 灰描边 + 白色 D），D 字形居中；开发模式窗口图标预览
            - **显示名**：DSH-Desktop → DSH Desktop（窗口标题、页面、弹窗）

            ### 改进
            - 设置页 Ollama 式精简：去掉冗余说明；「返回」有未保存修改时先确认
            - 非安全上下文 `crypto.randomUUID` polyfill：局域网 http 下模型/Agent 预设等设置页可用
            - 端口探测加固：Windows SO_REUSEADDR 共存检测，避免"两个实例瓜分同端口"
            - 上游升级 0.1.0-rc.6 → 0.1.0-rc.7（推理档位新增 low、Safari 输入框修复等）
            - 新增测试套件：设置存储单测、补丁回归（幂等/锚点）、LAN 启动集成测试

            ### 安全说明
            - 0.0.0.0 监听时，局域网内任何设备都能控制本机 agent（可执行本机命令），仅建议在可信网络使用；公网访问请使用 SSH 隧道
            - LAN 端可驱动 agent、读写会话，但 `settings.*` / `credentials.*` 等特权方法仍由上游钉在回环（模型设置页提示 403 为预期边界）
          # -rc / -beta 标签标记为 prerelease：不进 Latest，稳定版的
          # electron-updater（allowPrerelease=false）也不会把它们推给用户
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
