name: Build

on:
  # Package and publish only on version tags. Ordinary pushes and pull requests
  # are covered by ci.yml; use the manual trigger for an on-demand package build.
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --publish never
            artifact: DeepSeek-Harness-windows
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
            artifact: DeepSeek-Harness-macos
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --publish never
            artifact: DeepSeek-Harness-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and desktop integration
        run: npm run check

      - name: Build installers
        shell: bash
        env:
          # Explicit certificate name so the Developer ID Application identity is
          # used (auto-discovery may pick the runner's "Apple Development" cert).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Apple signing/notarization secrets only on macOS tagged releases;
          # manually triggered builds stay unsigned.
          CSC_NAME: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_NAME || '' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Empty-string CSC_LINK makes electron-builder treat "" as a path and
          # crash ("not a file"); drop the variable entirely when unused.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          # macOS + tag + certificate configured → sign & notarize; otherwise keep unsigned.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "${CSC_LINK:-}" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            ${{ matrix.cmd }}
          fi

      - name: Verify packaged Windows startup
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release (successful platforms)
    # The matrix keeps running when one platform fails. Always enter this job
    # for a tag so artifacts from the platforms that did finish still ship;
    # `download-artifact` ignores the failed matrix leg because it uploaded
    # nothing. A cancelled build is the one case where publishing is skipped.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download successful platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify at least one platform artifact
        shell: bash
        run: |
          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "No platform artifacts were produced; refusing to publish an empty release."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # 发布描述模板：每次发版前把「更新日志」小节改成当次内容
          # （上游版本号记得同步成 package.json 里 @deepseek-ai/dsh 的版本）。
          body: |
            ## DSH Desktop ${{ github.ref_name }}

            基于 DeepSeek Harness（@deepseek-ai/dsh 0.1.5-rc.1）的桌面外壳。

            内置 DeepSeek Harness：**@deepseek-ai/dsh 0.1.5-rc.1**。

            ### 改进
            - 新增主分支和 Pull Request CI，在 Node.js 22/24 上执行语法检查及完整集成测试；发版任务改为最小权限、并发保护和明确超时。
            - 修复固定端口不可用时仍把无效配置写入设置文件的问题，现在验证通过后才持久化。
            - 修正 Electron 43 本地打包命令和 Node.js 最低版本要求，补齐 Windows、macOS、Linux 平台命令。
            - 修复 `fast-uri` 与 `js-yaml` 的高危传递依赖漏洞，当前 `npm audit` 为 0。
            - 完善中英文 README、项目元数据、贡献与安全政策、CODEOWNERS、Issue / PR 模板和 Dependabot 配置。

            ### 安全说明
            - `0.0.0.0` 监听会向局域网开放可执行本机命令的 agent，仅建议在可信网络使用；公网访问请使用 SSH 隧道或其他认证层。
            - LAN 端可驱动 agent、读写会话，但 `settings.*` / `credentials.*` 等特权方法仍由上游限制在回环地址。
          # -rc / -beta 标签标记为 prerelease：不进 Latest，稳定版的
          # electron-updater（allowPrerelease=false）也不会把它们推给用户
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
