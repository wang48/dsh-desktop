<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Desktop 设置</title>
<style>
  /* Ollama 式黑白极简，跟随 DSH 最终主题（dark/light/system 解析后的实际亮暗） */
  body {
    --bg: #000000;
    --panel: #0d0d0d;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text: #fafafa;
    --text-secondary: #b3b3b3;
    --text-caption: #888888;
    --button-primary: #ffffff;
    --button-primary-text: #000000;
    --button-primary-hover: #e6e6e6;
    --hover: rgba(255, 255, 255, 0.08);
    --hover-border: rgba(255, 255, 255, 0.32);
    --input-bg: #141414;
    --input-focus: #ffffff;
    --slider-bg: #1a1a1a;
    --knob: #ffffff;
    --switch-checked-bg: #ffffff;
    --knob-checked: #000000;
    --code-bg: #1a1a1a;
    --error: #e05555;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  /* 亮色：主进程已把 prefers-color-scheme 对齐到 DSH 最终主题，首帧即正确 */
  @media (prefers-color-scheme: light) {
    body {
      --bg: #ffffff;
      --panel: #fafafa;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-caption: #8a8a8a;
      --button-primary: #000000;
      --button-primary-text: #ffffff;
      --button-primary-hover: #333333;
      --hover: rgba(0, 0, 0, 0.06);
      --hover-border: rgba(0, 0, 0, 0.28);
      --input-bg: #ffffff;
      --input-focus: #000000;
      --slider-bg: #e4e4e4;
      --knob: #ffffff;
      --switch-checked-bg: #000000;
      --knob-checked: #ffffff;
      --code-bg: #ececec;
      --error: #c62828;
    }
  }
  /* getState 拿到的最终主题再兜底一次（不依赖 media query 时序） */
  html[data-theme="light"] body {
    --bg: #ffffff;
    --panel: #fafafa;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.16);
    --text: #1a1a1a;
    --text-secondary: #555555;
    --text-caption: #8a8a8a;
    --button-primary: #000000;
    --button-primary-text: #ffffff;
    --button-primary-hover: #333333;
    --hover: rgba(0, 0, 0, 0.06);
    --hover-border: rgba(0, 0, 0, 0.28);
    --input-bg: #ffffff;
    --input-focus: #000000;
    --slider-bg: #e4e4e4;
    --knob: #ffffff;
    --switch-checked-bg: #000000;
    --knob-checked: #ffffff;
    --code-bg: #ececec;
    --error: #c62828;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    display: flex; justify-content: center; padding: 32px 16px; box-sizing: border-box;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 24px 28px; height: fit-content;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; color: var(--text); }
  .sub { font-size: 12px; color: var(--text-caption); margin: 0 0 20px; line-height: 1.6; }
  .section { margin: 16px 0 4px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .section:last-of-type { border-bottom: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
  .row label { font-size: 14px; color: var(--text); }
  .hint { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0; line-height: 1.6; }
  input[type="number"] {
    width: 110px; background: var(--input-bg); border: 1px solid var(--border-strong);
    border-radius: 6px; color: var(--text); padding: 7px 10px; font-size: 14px;
    font-family: var(--font);
    transition: border-color 0.15s;
  }
  input[type="number"]:focus { outline: none; border-color: var(--input-focus); }
  .hint.warn { color: var(--error); }
  #lan-urls { margin: 8px 0 0; }
  #lan-urls .lan-line {
    font-size: 13px; margin: 3px 0;
    font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
      'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
    word-break: break-all;
  }
  #lan-urls .lan-line a { color: var(--text); text-decoration: underline; cursor: pointer; }
  #lan-urls .lan-line a:hover { color: var(--text-caption); }
  /* Ollama 式滑动开关 */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--slider-bg);
    border: 1px solid var(--border-strong); border-radius: 22px;
    cursor: pointer; transition: background 0.15s;
  }
  .slider::before {
    content: ''; position: absolute; width: 16px; height: 16px;
    left: 2px; top: 2px; background: var(--knob); border-radius: 50%;
    transition: transform 0.15s;
  }
  .switch input:checked + .slider { background: var(--switch-checked-bg); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: var(--knob-checked); }
  .switch input:disabled + .slider { opacity: 0.45; cursor: not-allowed; }
  button {
    font-family: var(--font); font-size: 14px;
    border-radius: 6px; padding: 8px 18px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button.primary {
    background: var(--button-primary); color: var(--button-primary-text);
    border: 1px solid transparent;
  }
  button.primary:hover { background: var(--button-primary-hover); }
  button.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border-strong);
  }
  button.secondary:hover { background: var(--hover); border-color: var(--hover-border); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .footer-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  #status { font-size: 13px; margin-top: 10px; min-height: 18px; color: var(--text-secondary); }
  #status.ok { color: var(--text); }
  #status.err { color: var(--error); }
  #update-status { font-size: 13px; margin-top: 6px; min-height: 18px; color: var(--text-secondary); }
  code {
    background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
    font-size: 12px; font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
      'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  }
</style>
</head>
<body>
  <div class="card">
    <h1>DSH Desktop 设置</h1>
    <p class="sub" id="ver-line">加载中…</p>
    <p class="sub">以下设置只影响桌面外壳，不改动 DSH 本体及其数据。</p>

    <div class="section">
      <div class="row">
        <label for="web-port">监听端口</label>
        <input type="number" id="web-port" min="0" max="65535" step="1">
      </div>
      <p class="hint"><code>0</code> = 自动选择空闲端口（默认）；固定端口被占用时保存会提示。</p>
    </div>

    <div class="section">
      <div class="row">
        <label>开放局域网访问</label>
        <label class="switch">
          <input type="checkbox" id="web-lan">
          <span class="slider"></span>
        </label>
      </div>
      <p class="hint">开启后局域网内其他设备可访问（默认打开最近会话）；需要公网访问请用 SSH 隧道。</p>
      <p class="hint warn" id="host-warn" hidden>
        ⚠ 局域网内任何设备都能控制本机 agent（可执行本机命令），仅在可信网络使用。
      </p>
      <div id="lan-urls"></div>
      <p class="hint" id="lan-pending" hidden>保存并重启后显示访问链接。</p>
    </div>

    <div class="section">
      <div class="row">
        <label>自动检查更新</label>
        <label class="switch">
          <input type="checkbox" id="updates-auto">
          <span class="slider"></span>
        </label>
      </div>
      <p class="hint">启动后自动检查并下载新版本（下次启动生效）。</p>
    </div>

    <div class="section">
      <div class="row">
        <label>应用升级（版本 <span id="version">-</span>）</label>
        <button id="update-btn" class="secondary">检查更新</button>
      </div>
      <div id="update-status"></div>
      <p class="hint" id="update-hint"></p>
    </div>

    <div class="actions">
      <button id="save-btn" class="primary">保存并重启</button>
      <button id="reload-btn" class="secondary">重新加载当前页</button>
      <button id="log-btn" class="secondary">打开日志</button>
      <button id="data-btn" class="secondary">打开数据目录</button>
    </div>
    <div id="status"></div>

    <div class="footer-actions">
      <button id="back-btn" class="primary">返回</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    const status = (text, ok) => {
      const el = $('status')
      el.textContent = text
      el.className = ok === true ? 'ok' : ok === false ? 'err' : ''
    }

    async function loadState() {
      try {
        const state = await window.dshDesktop.getState()
        // 与主进程解析出的最终主题对齐（亮色时切换整体配色，不依赖 media query 时序）
        document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : 'dark'
        $('web-port').value = state.settings.web.port
        $('web-lan').checked = state.settings.web.host === '0.0.0.0'
        $('updates-auto').checked = state.settings.updates.auto !== false
        $('version').textContent = state.version
        $('ver-line').textContent = [
          `DSH Desktop v${state.version}（桌面外壳）`,
          `内置 DeepSeek Harness（@deepseek-ai/dsh）v${state.dshVersion}`,
          `Electron ${state.runtime.electron} · Node ${state.runtime.node}`,
          `平台：${state.platform} ${state.arch}${state.portable ? ' · 便携版' : state.packaged ? '' : ' · 开发模式'}`,
        ].join(' · ')
        renderLan(state.lan || [])
        $('update-hint').textContent = state.updateNote || ''
        $('update-status').textContent = state.updateStatus === 'idle' ? '' : state.updateStatus
        $('update-btn').disabled = !state.updateSupported
      } catch (error) {
        status(`读取状态失败：${error.message}`, false)
      }
    }

    // 局域网开关联动：开启时显示风险警告与访问链接；无链接时提示待重启生效
    function updateLanUi() {
      const lan = $('web-lan').checked
      $('host-warn').hidden = !lan
      $('lan-urls').hidden = !lan
      $('lan-pending').hidden = !lan || $('lan-urls').childElementCount > 0
    }

    // 表单改动标记：点「返回」时有未保存的修改则先提示保存
    let dirty = false
    const markDirty = () => { dirty = true }
    $('web-port').addEventListener('input', markDirty)
    $('web-lan').addEventListener('change', () => {
      updateLanUi()
      markDirty()
      // 开关切换后立即刷新一次链接快照（页面加载时的数据可能已过时）
      window.dshDesktop.getState().then((state) => renderLan(state.lan || [])).catch(() => {})
    })
    $('updates-auto').addEventListener('change', markDirty)

    // 显示当前局域网访问链接（0.0.0.0 监听且服务在跑时由主进程返回，仅 IPv4）
    // 点击在系统默认浏览器打开（target=_blank 走 setWindowOpenHandler → openExternal）
    function renderLan(lan) {
      const el = $('lan-urls')
      el.textContent = ''
      if (lan.length === 0) return
      for (const { url } of lan) {
        const line = document.createElement('div')
        line.className = 'lan-line'
        const link = document.createElement('a')
        link.href = url
        link.target = '_blank'
        link.rel = 'noreferrer'
        link.textContent = url
        line.appendChild(link)
        el.appendChild(line)
      }
      updateLanUi()
    }

    async function save() {
      const port = parseInt($('web-port').value, 10)
      if (!Number.isInteger(port) || port < 0 || port > 65535) {
        status('端口必须是 0–65535 的整数', false)
        return false
      }
      const host = $('web-lan').checked ? '0.0.0.0' : '127.0.0.1'
      status('正在保存…')
      try {
        const result = await window.dshDesktop.saveSettings({
          web: { host, port },
          updates: { auto: $('updates-auto').checked },
        })
        if (result.error) {
          status(result.error, false)
          return false
        }
        dirty = false
        status('已保存，正在重启服务…', true)
        await window.dshDesktop.restartWeb()
        return true
      } catch (error) {
        status(`保存失败：${error.message}`, false)
        return false
      }
    }

    $('save-btn').addEventListener('click', () => { save() })

    $('back-btn').addEventListener('click', async () => {
      // 有未保存的修改时先确认：确定 = 保存并重启（成功后自动回到 WebUI）
      if (dirty) {
        const ok = window.confirm('有未保存的更改。\n\n「确定」保存并重启服务；「取消」留在本页。')
        if (!ok) return
        await save()
        return
      }
      try {
        const result = await window.dshDesktop.backToWeb()
        if (result.error) status(result.error, false)
      } catch (error) {
        status(`返回失败：${error.message}`, false)
      }
    })

    $('reload-btn').addEventListener('click', () => window.dshDesktop.restartWeb())
    $('log-btn').addEventListener('click', () => window.dshDesktop.openLog())
    $('data-btn').addEventListener('click', () => window.dshDesktop.openDataDir())

    $('update-btn').addEventListener('click', async () => {
      $('update-status').textContent = '正在检查…'
      try {
        const result = await window.dshDesktop.checkUpdates()
        $('update-status').textContent = result || '已是最新'
      } catch (error) {
        $('update-status').textContent = `检查失败：${error.message}`
      }
    })

    window.dshDesktop.onUpdateStatus((text) => { $('update-status').textContent = text })

    loadState()
  </script>
</body>
</html>
