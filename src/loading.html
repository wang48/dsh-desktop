<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0f17;
    color: #c9d1d9;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .spinner {
    width: 44px; height: 44px;
    margin: 0 auto 22px;
    border: 4px solid rgba(99, 132, 255, 0.25);
    border-top-color: #4d7cfe;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; color: #e6edf3; }
  p { font-size: 13px; color: #8b949e; margin: 4px 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>DeepSeek Harness</h1>
    <p>正在启动本地服务…</p>
    <p>首次启动需要解压并初始化运行时，可能需要 1–3 分钟，请稍候。</p>
  </div>
</body>
</html>
